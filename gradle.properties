# Project-wide Gradle settings.

# JVM arguments — bump heap so Compose + Hilt + KSP can compile in parallel.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes — smaller R class per module
android.nonTransitiveRClass=true

# Parallel + configuration caching for faster builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
